services:
  plausible_db:
    networks: [webapps]

  plausible_events_db:
    networks: [webapps]

  plausible:
    # publish only if Cloudflared on HOST needs to reach it; otherwise omit
    ports:
      - "${HTTP_PORT:-18080}:8000"   # CE listens on 8000 in-container
    networks: [webapps]

networks:
  webapps:
    external: true
    name: webapps
