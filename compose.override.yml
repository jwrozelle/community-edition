# This override:
# - pulls secrets from .env
# - exposes Plausible on a host port for Cloudflared
# - sets proper DATABASE_URL / CLICKHOUSE_DATABASE_URL
# - replaces the hardcoded Postgres password

services:
  plausible_db:
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    # If you keep an external network, uncomment:
    # networks: [${DOCKER_NETWORK}]

  plausible_events_db:
    # networks: [${DOCKER_NETWORK}]
    # (No auth; DB created on first run via URL)
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1

  plausible:
    # Expose host port -> container 8000 (CE runs on 8000)
    ports:
      - "${HOST_PLAUSIBLE_PORT:-18080}:8000"
    environment:
      # Required
      - BASE_URL=${BASE_URL}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      # DBs
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@plausible_db:5432/${POSTGRES_DB}
      - CLICKHOUSE_DATABASE_URL=http://plausible_events_db:8123/${CLICKHOUSE_DB}
      # # Optional
      # - DISABLE_REGISTRATION=${DISABLE_REGISTRATION}
      # - ENABLE_EMAIL_VERIFICATION=${ENABLE_EMAIL_VERIFICATION}
      - ADMIN_USER_EMAIL=${ADMIN_USER_EMAIL}
      - ADMIN_USER_NAME=${ADMIN_USER_NAME}
      - ADMIN_USER_PWD=${ADMIN_USER_PWD}
      # # Mail (optional)
      # - MAILER_ADAPTER=${MAILER_ADAPTER}
      # - MAILER_EMAIL=${MAILER_EMAIL}
      # - MAILER_NAME=${MAILER_NAME}
      # - SMTP_HOST_ADDR=${SMTP_HOST_ADDR}
      # - SMTP_HOST_PORT=${SMTP_HOST_PORT}
      # - SMTP_USER_NAME=${SMTP_USER_NAME}
      # - SMTP_USER_PWD=${SMTP_USER_PWD}
      # - SMTP_HOST_SSL_ENABLED=${SMTP_HOST_SSL_ENABLED}
    networks: [${DOCKER_NETWORK}]

# If you actually use an external network, uncomment:
networks:
  ${DOCKER_NETWORK}:
    external: true
