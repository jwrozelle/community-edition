services:
  plausible_db:
    networks:
      - plausible_backend

  plausible_events_db:
    networks:
      - plausible_backend

  plausible:
    ports:
      - "${HOST_PORT:-18080}:${HTTP_PORT:-80}"
    networks:
      - plausible_backend
      - webapps

networks:
  plausible_backend:
    internal: true

  webapps:
    external: true
    name: webapps